<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dholasan Community Portal · ધોળાસણ ગ્રામ પોર્ટલ</title>
    <style>
      :root {
        --brand-orange: 234 88 12;
        --brand-blue: 30 58 138;
      }
      ::selection {
        background-color: rgb(var(--brand-orange) / 1);
        color: #ffffff;
      }
      .bg-brand-orange {
        background-color: rgb(var(--brand-orange) / 1) !important;
      }
      .text-brand-orange {
        color: rgb(var(--brand-orange) / 1) !important;
      }
      .border-brand-orange {
        border-color: rgb(var(--brand-orange) / 1) !important;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Rasa:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
              gujarati: ['"Hind Vadodara"', '"Rasa"', 'sans-serif'],
            },
            colors: {
              'brand-orange': 'rgb(var(--brand-orange) / <alpha-value>)',
              'brand-blue': 'rgb(var(--brand-blue) / <alpha-value>)',
              'brand-primary': 'rgb(var(--brand-orange) / <alpha-value>)',
              'brand-secondary': 'rgb(var(--brand-blue) / <alpha-value>)',
              'brand-yellow': '#F59E0B',
              'brand-gold': '#D97706',
              'brand-sand': '#FEF3C7',
            }
          }
        }
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.4"
  }
}
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-brand-orange selection:text-white">

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
